<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Stacking Birthday Cake</title>
    <style>
        /* Color Palette & Base Styles */
        :root {
            --bg-color: #fcf0f2;       
            --card-bg: #fad2e1;        
            --cake-frosting: #fff5f7;  
            --cake-sponge-dark: #e8a5b8;
            --cake-sponge-light: #f3bccc;
            --text-primary: #9c4d62;   
            --text-secondary: #bd7387;
            --flame-warm: #ffd166;     
            --flame-glow: #ffb5a7;     
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Floating Heart Elements */
        .ambient-heart {
            position: absolute;
            color: var(--text-secondary);
            pointer-events: none; 
            z-index: 1;
            bottom: -50px; 
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: var(--target-opacity, 0.4);
            }
            90% {
                opacity: var(--target-opacity, 0.4);
            }
            100% {
                transform: translateY(-115vh) rotate(360deg); 
                opacity: 0;
            }
        }

        /* Card Container */
        .card {
            background-color: var(--card-bg);
            width: 340px;
            height: 460px; 
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(189, 115, 135, 0.2);
            position: relative;
            z-index: 5;
        }

        /* Cake Composition Tower */
        .cake-tower {
            position: relative;
            height: 180px;
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* Base Component properties for individual layers */
        .layer {
            height: 22px;
            border-radius: 6px;
            position: relative;
            opacity: 0;
            transform: translateY(-200px);
            animation: dropStack 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Bottom Sponge Layer */
        .layer-bottom {
            width: 170px;
            background-color: var(--cake-sponge-dark);
            z-index: 1;
            animation-delay: 0.2s;
        }

        /* Middle Cream Layer */
        .layer-middle {
            width: 164px;
            background-color: var(--cake-frosting);
            height: 10px;
            z-index: 2;
            animation-delay: 0.5s;
        }

        /* Top Sponge Layer */
        .layer-top {
            width: 158px;
            background-color: var(--cake-sponge-light);
            z-index: 3;
            animation-delay: 0.8s;
        }

        /* Drip Frosting Crown Layer */
        .layer-frosting {
            width: 158px;
            height: 18px;
            background-color: var(--cake-frosting);
            border-radius: 6px 6px 4px 4px;
            z-index: 4;
            animation-delay: 1.1s;
        }

        /* Icing Drips */
        .layer-frosting::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 9px;
            width: 140px;
            height: 10px;
            background-image: radial-gradient(circle at 10px -2px, var(--cake-frosting) 9px, transparent 10px);
            background-size: 20px 20px;
        }

        /* Candle Wrapper Drop System */
        .candle-holder {
            position: absolute;
            bottom: 64px; 
            left: 50%;
            width: 6px;
            height: 34px;
            z-index: 10;
            opacity: 0;
            transform: translate(-50%, -200px);
            animation: dropStackCandle 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 1.4s;
        }

        .candle {
            background: #ffffff;
            border-radius: 4px;
            width: 100%;
            height: 100%;
            cursor: pointer;
            position: relative;
        }

        .candle::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 4px;
            top: 8px;
            background: var(--cake-sponge-dark);
        }

        /* Flame Component */
        .fuego {
            border-radius: 100% 0 100% 100%;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%) rotate(-45deg);
            width: 10px;
            height: 20px;
            background: var(--flame-warm);
            box-shadow: 0 0 12px var(--flame-warm), 0 0 25px var(--flame-glow);
            animation: flicker 0.6s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }

        /* Greeting Text Layout */
        .text-greet {
            color: var(--text-primary);
            font-size: 20px;
            letter-spacing: -0.5px;
            margin: 35px 0 10px 0;
            font-weight: normal;
            opacity: 0;
            animation: revealText 0.8s ease-out 1.8s forwards;
            text-align: center;
        }

        /* Heart Icon Styling */
        .heart-icon {
            color: var(--text-secondary);
            font-size: 24px;
            opacity: 0;
            margin-top: 5px;
            animation: revealText 0.8s ease-out 2.1s forwards, heartbeat 1.2s infinite ease-in-out 2.9s alternate;
        }

        /* ANIMATION TIMELINES */
        @keyframes dropStack {
            0% { opacity: 0; transform: translateY(-200px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes dropStackCandle {
            0% { opacity: 0; transform: translate(-50%, -200px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes revealText {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) rotate(-43deg) scale(0.95); }
            100% { transform: translateX(-50%) rotate(-47deg) scale(1.05); }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="cake-tower">
            <div class="candle-holder" id="birthdayCandle">
                <div class="candle">
                    <div class="fuego" id="candleFlame"></div>
                </div>
            </div>
            <div class="layer layer-frosting"></div>
            <div class="layer layer-top"></div>
            <div class="layer layer-middle"></div>
            <div class="layer layer-bottom"></div>
        </div>
        <h1 class="text-greet">happy birthday, baby!</h1>
        <div class="heart-icon">♥</div>
    </div>

    <script>
        // --- 1. Interaction to Blow out Candle ---
        const candle = document.getElementById('birthdayCandle');
        const flame = document.getElementById('candleFlame');

        candle.addEventListener('click', function() {
            if (flame) {
                flame.style.display = 'none'; 
                alert("Make a wish! 🌸✨");
            }
        });

        // --- 2. Background Ambient Floating Hearts Generator ---
        function createAmbientHeart() {
            const heart = document.createElement('div');
            heart.classList.add('ambient-heart');
            heart.innerHTML = '♥';
            
            // Randomize visual traits
            const size = Math.floor(Math.random() * 20) + 8;     // Wider size variance (8px to 28px)
            const leftPos = Math.random() * 100;                 // Anywhere across screen width
            const duration = Math.random() * 5 + 4;              // Faster travel speed range (4s to 9s)
            const opacity = Math.random() * 0.35 + 0.15;         // Subtle alpha range

            heart.style.fontSize = `${size}px`;
            heart.style.left = `${leftPos}vw`;
            heart.style.animationDuration = `${duration}s`;
            heart.style.setProperty('--target-opacity', opacity);

            document.body.appendChild(heart);

            // Clean up heart element once it moves off screen
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // FIXED: Spawns hearts much faster now (every 250ms instead of 700ms)
        setInterval(createAmbientHeart, 250);
        
        // Populate the viewport instantly with a few bursts so it looks dense right away
        for(let i = 0; i < 15; i++) {
            setTimeout(createAmbientHeart, Math.random() * 2000);
        }
    </script>

</body>
</html>
